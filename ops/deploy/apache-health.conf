# Include in the NEW instance's existing SSL VirtualHost only; retain its PHP handler.
# DocumentRoot /srv/adsr-preview/current/public
# <Directory /srv/adsr-preview/current/public>
#     Options FollowSymLinks
#     AllowOverride All
#     Require all granted
# </Directory>
<Location "/_adsr-health.php">
    Require local
</Location>
# Retain hashed assets across both deployment and rollback; generated files are append-only.
Alias /build/assets/ /srv/adsr-preview/shared/vite-assets/
<Directory /srv/adsr-preview/shared/vite-assets>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    <FilesMatch "\.(php|phtml|phar|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
# PHP requests must use the resolved release path. Graceful Apache reload follows each
# symlink change, flushing mod_php OPcache/realpath caches for new workers. If the host
# uses FPM instead, STOP: review an explicit FPM reload too before installation.
